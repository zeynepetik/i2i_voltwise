spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/voltwise
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: voltwise-core
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.i2iacademy.voltwise.*"
        auto.offset.reset: earliest

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          #bağlantı dış bir serivse gittiği için rimeout tabımlanmazsa thread tıkanır
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8081}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

voltwise:
  kafka:
    topics: 
      registration: ${KAFKA_TOPIC_REGISTRATION:home-registration}
      telemetry: ${KAFKA_TOPIC_TELEMETRY:appliance-telemetry}
  ignite:
    host: ${IGNITE_HOST:localhost}
    port: ${IGNITE_CLIENT_PORT:10800}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY}
      api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.apache.kafka: WARN
    com.i2iacademy.voltwise: DEBUG